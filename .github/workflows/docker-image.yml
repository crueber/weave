name: docker image
# Builds the server image and publishes it to GHCR.
#   ghcr.io/crueber/weave:latest        (default branch)
#   ghcr.io/crueber/weave:sha-<short>   (every push)
#   ghcr.io/crueber/weave:<semver>      (tags v*)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crueber/weave
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
