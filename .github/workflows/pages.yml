name: pages
# Publishes the project website (site/ + docs/demo.webm) to GitHub Pages: https://crueber.github.io/weave/
# Staged by scripts/site-stage.sh, the same script `make site` / `make site-preview` run locally.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions. Without it configure-pages fails;
# enable it, then run this workflow by hand (Actions -> pages -> Run workflow).
#
# Triggers: a publish that changes the site or the video, a published release, or by hand. Note: a release
# created by another workflow with the built-in GITHUB_TOKEN does not start new workflow runs, so the
# push trigger and workflow_dispatch are what normally deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/demo.webm'
      - 'scripts/site-stage.sh'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: stage the site
        run: bash scripts/site-stage.sh dist/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
          include-hidden-files: true   # keeps .nojekyll
      - id: deployment
        uses: actions/deploy-pages@v5
